services:

  postgres:
    image: postgres:latest
    environment:
      - POSTGRES_DB=fleetpulse
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=fleetpulse
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: fleetpulse-api
    build:
      context: .
      dockerfile: FleetPulse.Api/dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fleetpulse;Username=postgres;Password=fleetpulse
      - RabbitMq__Host=rabbitmq
      - RabbitMq__Enabled=true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: fleetpulse-worker
    build:
      context: .
      dockerfile: FleetPulse.Worker/dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fleetpulse;Username=postgres;Password=fleetpulse
      - RabbitMq__Host=rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    image: fleetpulse-frontend
    build:
      context: .
      dockerfile: frontend/dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api